<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171c" media="(prefers-color-scheme: dark)" />
    <title>Offline · IamCandidate</title>
    <style>
      :root {
        --bg: #fcfbf8;
        --fg: #1b2230;
        --muted: #6b7280;
        --brand: #0f766e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171c;
          --fg: #eef1f4;
          --muted: #9aa3ad;
          --brand: #5eead4;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: var(--bg);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>IamCandidate needs a connection to load your workspace. It'll pick up where you left off once you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <script>
      window.addEventListener("online", () => location.reload())
    </script>
  </body>
</html>
